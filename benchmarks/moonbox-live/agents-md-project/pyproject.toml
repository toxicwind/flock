[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-md"
version = "0.1.0"
description = "Unified agent configuration manager — organize, query, and serve agent definitions across repos"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "toxicwind", email = "toxicwind@users.noreply.github.com"}]
keywords = ["agents", "mcp", "llm", "ai", "configuration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "watchdog>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.1.0", "mypy>=1.0", "playwright>=1.40"]

[project.scripts]
agents-md = "agents_md.cli:main"
agents-md-mcp = "mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/toxicwind/agents-md"
Repository = "https://github.com/toxicwind/agents-md"
Issues = "https://github.com/toxicwind/agents-md/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_md", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
