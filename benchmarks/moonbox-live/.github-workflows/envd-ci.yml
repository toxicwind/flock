name: envd-ci
on:
  push:
    branches: [main, master]
    paths:
      - 'shim/**'
      - 'interceptor/**'
      - 'proxy/**'
      - 'scripts/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/envd-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'shim/**'
      - 'interceptor/**'
      - 'proxy/**'
      - 'scripts/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/envd-ci.yml'

concurrency:
  group: envd-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9df4351 # v5.2.2
      - uses: actions/setup-python@0b93645e9fea7318e63b7ba5b5a3c4e1a4a752f1 # v5.4.0
        with:
          python-version: '3.12'
      - run: uv pip install --system ruff mypy pyright
      - run: ruff check shim/ interceptor/ proxy/ scripts/ src/
      - run: ruff format --check shim/ interceptor/ proxy/ scripts/ src/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9df4351 # v5.2.2
      - uses: actions/setup-python@0b93645e9fea7318e63b7ba5b5a3c4e1a4a752f1 # v5.4.0
        with:
          python-version: '3.12'
      - run: uv pip install --system -e ".[dev]"
      - run: pyright shim/ interceptor/ proxy/ scripts/ src/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9df4351 # v5.2.2
      - uses: actions/setup-python@0b93645e9fea7318e63b7ba5b5a3c4e1a4a752f1 # v5.4.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv pip install --system -e ".[test]"
      - run: pytest --cov=envd_project --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@1e68e1f4c04e15b048f11a9e9d4346f4c494e8df # v5.4.2
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9df4351 # v5.2.2
      - uses: actions/setup-python@0b93645e9fea7318e63b7ba5b5a3c4e1a4a752f1 # v5.4.0
        with:
          python-version: '3.12'
      - run: uv pip install --system -e ".[test]"
      - run: pytest tests/integration/ -v --timeout=60
        env:
          ENVD_TEST_MODE: "1"
