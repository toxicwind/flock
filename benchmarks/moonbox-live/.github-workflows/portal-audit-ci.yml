name: portal-audit-ci
on:
  push:
    branches: [main, master]
    paths:
      - 'anomalies/**'
      - 'credentials/**'
      - 'extractors/**'
      - 'methods/**'
      - 'schemas/**'
      - 'services/**'
      - '.github/workflows/portal-audit-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'anomalies/**'
      - 'credentials/**'
      - 'extractors/**'
      - 'methods/**'
      - 'schemas/**'
      - 'services/**'
      - '.github/workflows/portal-audit-ci.yml'

concurrency:
  group: portal-audit-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - run: npm install -g ajv-cli
      - run: |
          for schema in schemas/*.json; do
            ajv validate -s "$schema" -d "extractors/*.json" || true
          done

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec826a # v19.1.0
        with:
          globs: '**/*.md'
          config: '.markdownlint.json'

  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --only-verified
